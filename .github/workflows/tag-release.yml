name: tag-release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: tag the workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: read the workspace version
        id: version
        shell: bash
        run: |
          version=$(awk '/^\[workspace\.package\]/{f=1; next} /^\[/{f=0} f && /^version[ ]*=/{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::could not read a x.y.z version from [workspace.package] in Cargo.toml (got '$version')"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: tag the commit and start the release build
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "${TAG} already exists; bump [workspace.package] version in Cargo.toml to release again"
            exit 0
          fi
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          # A tag pushed with the default token does not trigger release.yml, so start it here.
          gh workflow run release.yml --ref "${TAG}"
          echo "started release.yml for ${TAG}"
