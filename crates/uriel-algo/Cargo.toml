[package]
name = "uriel-algo"
description = "Graph-data-science style algorithms on immutable CSR projections for seal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Multi-threaded variants (betweenness centrality) via rayon.
parallel = ["dep:rayon"]

[dependencies]
thiserror = "2"
rayon = { version = "1", optional = true }

[dev-dependencies]
peak_alloc = "0.3.0"
