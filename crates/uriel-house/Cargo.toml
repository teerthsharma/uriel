[package]
name = "uriel-house"
description = "House-mode harness for seal: validates and merges fellows' charts, schedules goals under a resource governor, and gates every claim on a RED-first test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
uriel-core = { path = "../uriel-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
