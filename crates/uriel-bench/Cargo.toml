[package]
name = "uriel-bench"
description = "Criterion benches and a self-calibrating latency regression gate for the seal crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
uriel-core = { path = "../uriel-core" }
uriel-tier = { path = "../uriel-tier" }
uriel-place = { path = "../uriel-place" }
uriel-topo = { path = "../uriel-topo" }
uriel-rag = { path = "../uriel-rag" }
uriel-query = { path = "../uriel-query" }
uriel-mcp = { path = "../uriel-mcp" }
uriel-sys = { path = "../uriel-sys" }
serde_json = "1"
tempfile = "3.27.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core_tier"
harness = false

[[bench]]
name = "tier_policy"
harness = false

[[bench]]
name = "place"
harness = false

[[bench]]
name = "topo"
harness = false

[[bench]]
name = "rag"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "mcp_compact"
harness = false

[[bench]]
name = "sys"
harness = false
