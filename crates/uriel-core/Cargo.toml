[package]
name = "uriel-core"
description = "Embedded property-graph storage engine for seal: values, transactions, indexes, constraints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
redb = "4.4.0"
uriel-place = { path = "../uriel-place" }
uriel-tier = { path = "../uriel-tier" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

