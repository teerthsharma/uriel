[package]
name = "uriel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uriel"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sysinfo = "0.39"
enable-ansi-support = "0.3"
uriel-mcp = { path = "../uriel-mcp" }
uriel-rag = { path = "../uriel-rag" }
uriel-core = { path = "../uriel-core" }
uriel-place = { path = "../uriel-place" }
uriel-dispatch = { path = "../uriel-dispatch" }
uriel-page = { path = "../uriel-page" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
